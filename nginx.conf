worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = / {
            rewrite ^ /static/index.html last;
        }

        location / {
            try_files $uri =404;
        }

        location /yt {
            return 301 https://www.youtube.com/@AlgoraKiko;
        }

        location /youtube {
            return 301 https://www.youtube.com/@AlgoraKiko;
        }

        location /t {
            return 301 https://twitter.com/AlgoraKiko;
        }

        location /x {
            return 301 https://twitter.com/AlgoraKiko;
        }

        location /twt {
            return 301 https://twitter.com/AlgoraKiko;
        }

        location /twitter {
            return 301 https://twitter.com/AlgoraKiko;
        }

        location /ttv {
            return 301 https://twitch.tv/AlgoraKiko;
        }

        location /twitch {
            return 301 https://twitch.tv/AlgoraKiko;
        }

        location /discord {
            return 301 https://discord.com/invite/cFVFG26;
        }

        location /insta {
            return 301 https://www.instagram.com/algorakiko/;
        }

        location /instagram {
            return 301 https://www.instagram.com/algorakiko/;
        }

        location /tiktok {
            return 301 https://www.tiktok.com/@algorakiko;
        }

        location /spotify {
            return 301 https://open.spotify.com/user/jailenetalampas;
        }

        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
